[project]
name = "orcarouter-lite"
version = "0.1.0"
description = "Self-hosted LLM router with a managed safety net. OpenAI-compatible, BYOK, single-workspace edition of OrcaRouter."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",

    "litellm>=1.40.0",
    "google-auth>=2.0.0",

    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    "structlog>=24.1.0",
    "httpx>=0.27.0",

    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",

    "orjson>=3.10.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
redis = ["redis[hiredis]>=5.0.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "packages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "real_remote: opt out of the network-isolation autouse fixture (for tests of the real fetcher path)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501", "B008", "E402"]
