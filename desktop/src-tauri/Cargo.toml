[package]
name = "orcarouter-lite-desktop"
version = "0.1.1"
description = "OrcaRouter Lite menu-bar app: put a budget on every coding agent"
authors = ["Continuum AI Corp"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "orca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
# deep-link: a second launch carrying an orca:// link hands it to this one.
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
# orca:// links (V3). Parsed and validated in logic.rs; never acted on directly.
tauri-plugin-deep-link = "=2.6.3"
# Read an OrcaRouter key the user copied (H1), copy diagnostics (D8) and the savings card (V2).
tauri-plugin-clipboard-manager = "=2.5.0"
# Starts Orca at login (with --background) so connected agents keep working after a restart.
tauri-plugin-autostart = "=2.7.0"
# Loaded only in builds that carry the updater's public key (release CI adds
# it when the signing key is configured); see logic::updates_installable.
tauri-plugin-updater = "=2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to 127.0.0.1 only: no TLS stack needed.
ureq = { version = "2", default-features = false, features = ["json"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "=2.5.9"
base64 = "=0.22.1"

# "Install command-line tool…" on Windows: the user's PATH (HKCU\Environment)
# and the settings-changed broadcast that makes new terminals see it.
[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
