name: desktop

# The Orca menu-bar app: tests on every change, installers on tags.
#
#   test     node --test (view logic) + cargo test (tray/notification rules)
#   bundle   on v* tags and manual runs: freeze the engine with PyInstaller,
#            then `tauri build` → .dmg (macOS), .deb/.AppImage (Linux),
#            .msi/.exe (Windows); attached to the GitHub release on tags.
#
# macOS signing and notarisation run only when the APPLE_* secrets exist;
# without them the .dmg is built unsigned (Gatekeeper will warn on first open).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "app/**"
      - "packages/**"
      - "requirements.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "app/routes/desktop.py"
      - "app/orca_cli.py"
      - "packages/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  test:
    name: desktop tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: view logic (node --test)
        working-directory: desktop
        run: npm test
      - name: system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: dev sidecar stand-in (tauri-build checks externalBin exists)
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p desktop/src-tauri/binaries
          printf '#!/bin/sh\nexec orca "$@"\n' > "desktop/src-tauri/binaries/orca-engine-$triple"
          chmod +x "desktop/src-tauri/binaries/orca-engine-$triple"
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --lib

  bundle:
    name: installer (${{ matrix.name }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple silicon, os: macos-14 }
          - { name: macOS Intel, os: macos-13 }
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: install the engine from the hash-locked lockfile
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install "pyinstaller>=6.10"
      - name: freeze the engine
        run: python desktop/engine/build_engine.py
      - name: smoke the frozen engine
        shell: bash
        run: |
          bin=$(ls desktop/src-tauri/binaries/orca-engine-*)
          export ORCA_HOME="$RUNNER_TEMP/orca-smoke"
          "$bin" up --port 8791 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8791/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8791/desktop/panel.html | grep -q "OrcaRouter Lite"
          test -s "$ORCA_HOME/app.key"
          kill %1 || true
      - name: tauri build
        working-directory: desktop
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: orcarouter-lite-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber \
            desktop/src-tauri/target/release/bundle/dmg/*.dmg \
            desktop/src-tauri/target/release/bundle/deb/*.deb \
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            desktop/src-tauri/target/release/bundle/msi/*.msi \
            desktop/src-tauri/target/release/bundle/nsis/*.exe
